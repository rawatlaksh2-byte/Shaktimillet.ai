name: Approval queue tests

on:
  push:
    branches: [youtube-automation]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  approval-queue:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run approval queue tests
        run: node --test youtube-agent/approval-queue.test.mjs
